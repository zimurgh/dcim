<section class="flex flex-col gap-4">
  <header class="space-y-1">
    <h1 class="text-2xl font-semibold tracking-tight">Data Center</h1>
    <p class="text-sm text-muted-foreground">
      Site inventory tree: Data Center → Cage → Rack → Rack Device → Port.
    </p>
  </header>

  <div class="h-[36rem] overflow-hidden rounded-lg border border-border">
    <ag-grid-angular
      class="h-full w-full"
      [theme]="theme"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [treeData]="treeData"
      [getDataPath]="getDataPath"
      [autoGroupColumnDef]="autoGroupColumnDef"
      [groupDefaultExpanded]="groupDefaultExpanded"
    />
  </div>
</section>
