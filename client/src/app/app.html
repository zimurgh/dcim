<div class="flex min-h-screen flex-col bg-background text-foreground">
  <header class="sticky top-0 z-40 border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/80">
    <div class="mx-auto flex h-14 max-w-7xl items-center gap-6 px-4 sm:px-6">
      <a
        routerLink="/data-center"
        class="shrink-0 text-base font-semibold tracking-tight text-foreground"
      >
        DCIM
      </a>

      <nav class="flex min-w-0 flex-1 items-center gap-1 overflow-x-auto" aria-label="Primary">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-accent text-accent-foreground"
            class="inline-flex h-9 shrink-0 items-center rounded-md px-3 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent/70 hover:text-accent-foreground"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6">
    <router-outlet />
  </main>
</div>
