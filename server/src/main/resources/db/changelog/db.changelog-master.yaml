databaseChangeLog:
  - changeSet:
      id: 0001-baseline
      author: dcim
      comment: Baseline placeholder for DCIM schema
      changes:
        - sql:
            sql: SELECT 1
  - changeSet:
      id: 0002-modulith-event-publication
      author: dcim
      comment: Spring Modulith JPA event publication registry
      changes:
        - createTable:
            tableName: EVENT_PUBLICATION
            columns:
              - column:
                  name: ID
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: LISTENER_ID
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: EVENT_TYPE
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: SERIALIZED_EVENT
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: PUBLICATION_DATE
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: COMPLETION_DATE
                  type: TIMESTAMP
              - column:
                  name: STATUS
                  type: VARCHAR(64)
              - column:
                  name: COMPLETION_ATTEMPTS
                  type: INT
              - column:
                  name: LAST_RESUBMISSION_DATE
                  type: TIMESTAMP
  - changeSet:
      id: 0003-firm-identity-and-history
      author: dcim
      comment: Stable firm identity + append-only firm history
      changes:
        - createTable:
            tableName: T_FIRM_IDENTITY
            columns:
              - column:
                  name: FIRM_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
        - createTable:
            tableName: T_FIRM_HISTORY
            columns:
              - column:
                  name: FIRM_HISTORY_ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: FIRM_ID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: FIRM_NAME
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: PARENT_FIRM_NAME
                  type: VARCHAR(50)
              - column:
                  name: VALID_FROM
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: VALID_TO
                  type: DATE
              - column:
                  name: APPLIED_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: APPLIED_BY
                  type: VARCHAR(50)
              - column:
                  name: ACTION
                  type: VARCHAR(50)
              - column:
                  name: STATUS
                  type: VARCHAR(50)
        - addForeignKeyConstraint:
            constraintName: FK_FIRM_HISTORY_IDENTITY
            baseTableName: T_FIRM_HISTORY
            baseColumnNames: FIRM_ID
            referencedTableName: T_FIRM_IDENTITY
            referencedColumnNames: FIRM_ID
        - createIndex:
            tableName: T_FIRM_HISTORY
            indexName: IX_FIRM_HISTORY_FIRM_ID
            columns:
              - column:
                  name: FIRM_ID
        - createIndex:
            tableName: T_FIRM_HISTORY
            indexName: IX_FIRM_HISTORY_CURRENT
            columns:
              - column:
                  name: FIRM_ID
              - column:
                  name: VALID_TO
