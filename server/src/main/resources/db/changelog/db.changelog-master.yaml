      comment: Baseline placeholder for DCIM schema
      changes:
        - sql:
            sql: SELECT 1
  - changeSet:
      id: 0002-modulith-event-publication
      author: dcim
      comment: Spring Modulith JPA event publication registry
      changes:
        - createTable:
            tableName: EVENT_PUBLICATION
            columns:
              - column:
                  name: ID
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: LISTENER_ID
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: EVENT_TYPE
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: SERIALIZED_EVENT
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: PUBLICATION_DATE
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: COMPLETION_DATE
                  type: TIMESTAMP
              - column:
                  name: STATUS
                  type: VARCHAR(64)
              - column:
                  name: COMPLETION_ATTEMPTS
                  type: INT
              - column:
                  name: LAST_RESUBMISSION_DATE
                  type: TIMESTAMP
