spring.application.name=dcim-server

spring.datasource.url=jdbc:mariadb://${DCIM_DB_HOST:localhost}:${DCIM_DB_PORT:3306}/${DCIM_DB_NAME:dcim}
spring.datasource.username=${DCIM_DB_USER:dcim}
spring.datasource.password=${DCIM_DB_PASSWORD:dcim}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=com.dcim.UpperSnakeCaseNamingStrategy
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
