spring.datasource.url=jdbc:h2:mem:dcim;MODE=MariaDB;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=com.dcim.UpperSnakeCaseNamingStrategy
spring.liquibase.enabled=true
